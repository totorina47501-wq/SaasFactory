services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: factory_test
      POSTGRES_USER: factory_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a disposable local-only POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_test -d factory_test"]
      interval: 2s
      timeout: 3s
      retries: 20
