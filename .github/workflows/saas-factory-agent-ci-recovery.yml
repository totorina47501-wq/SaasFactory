name: SaaS Factory agent CI recovery
# Trusted main-only bounded AI correction. Never execute or checkout PR code.
# PAUSED 2026-11-10 by owner. See docs/AGENT-PAUSE-AND-RESUME.md
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: saas-factory-ci-recovery-${{ github.event.workflow_run.pull_requests[0].number || 'unassociated' }}
  cancel-in-progress: false
jobs:
  recover:
    if: >-
      false &&
      github.repository == 'totorina47501-wq/SaasFactory' &&
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.name == 'SaaS Factory CI' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'copilot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require repository-scoped user identity for Copilot comments
        env:
          AUTHORIZED: ${{ secrets.COPILOT_DISPATCH_TOKEN != '' }}
        run: |
          if ! test "$AUTHORIZED" = 'true'; then
            echo '::error::Missing repository-scoped COPILOT_DISPATCH_TOKEN'
            exit 1
          fi
      - name: Checkout trusted main recovery code only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Request bounded Copilot repair after verified failed CI
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_DISPATCH_TOKEN }}
          script: |
            const recover = require('./.github/scripts/agent-ci-recovery.cjs');
            process.env.EXPECTED_REPO = 'totorina47501-wq/SaasFactory';
            await recover({github, context, core});
