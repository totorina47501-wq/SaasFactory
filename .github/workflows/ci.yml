name: SaaS Factory CI
# Deterministic CI only: no Copilot review or paid AI agents are invoked here.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: saas-factory-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  free-review:
    name: Free deterministic PR review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR patch integrity and forbidden tracked secrets
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          if grep -Ei '(^|/)(\.env($|\.)|id_rsa$|id_ed25519$|.*\.(pem|p12|pfx|key)$)' /tmp/changed-files.txt; then
            echo '::error::Potential secret material tracked in this PR'
            exit 1
          fi
          if git diff --name-only --diff-filter=U "$BASE_SHA" "$HEAD_SHA" | grep -q .; then
            echo '::error::Unmerged files detected'
            exit 1
          fi
          echo 'Free PR patch checks passed (no AI credits consumed).'
  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test versioned SaaS intake handoff offline
        run: node --test tests/intake.test.mjs
      - name: Test runtime module contracts offline
        run: node --test tests/runtime-contracts.test.mjs
      - name: Test module registry and resolver offline
        run: node --test tests/module-registry.test.mjs tests/module-resolver.test.mjs
      - name: Test standalone generator offline
        run: npm test
      - name: Test agent dispatch policy offline
        run: node --test tests/agent-dispatch.test.cjs
      - name: Test one final Copilot review offline
        run: node --test tests/final-review-once.test.mjs
      - name: Test bounded CI recovery policy offline
        run: node --test tests/agent-ci-recovery.test.cjs
      - name: Test read-only operations report offline
        run: node --test tests/agent-report.test.cjs
      - name: Validate specialist agent security contracts offline
        run: node --test tests/specialist-agents.test.cjs
      - name: Validate optional quality integrations offline
        run: node --test tests/factory-quality-config.test.cjs
      - name: Test Projects V2 status synchronization offline
        run: node --test tests/projects-v2-sync.test.cjs
      - name: Verify complete SaaS starter creation offline
        run: node --test tests/saas-launch-readiness.test.mjs
      - name: Verify deterministic dry-run
        run: |
          node generate.mjs --config examples/minimal.json --output-root /tmp/saas-factory-dry-run > /tmp/factory-manifest.json
          test ! -e /tmp/saas-factory-dry-run
          node -e "const m=require('/tmp/factory-manifest.json');if(m.mode!=='dry-run'||m.files.length<10)process.exit(1)"
  generated-app:
    needs: generator
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimal
            config: examples/minimal.json
            slug: atelier-exemple
            playwright: true
          - profile: starter-v2
            config: examples/saas-starter-v2.json
            slug: saas-starter-v2
            playwright: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate an isolated project
        run: node generate.mjs --config ${{ matrix.config }} --output-root "$RUNNER_TEMP/generated" --write
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-generated-${{ matrix.profile }}-next-15.5.28-react-19.3.1-ts-5.9.3-v1
      - name: Install generated project dependencies
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test generated project
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: npm test
      - name: Typecheck generated project
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: npm run typecheck
      - name: Build generated project
        if: ${{ matrix.profile == 'minimal' }}
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Report blocked v2 build
        if: ${{ matrix.profile == 'starter-v2' }}
        run: echo "::warning::The generated v2 API route currently fails Next.js route type generation; see docs/testing.md."
      - name: Install Playwright runner
        if: ${{ matrix.playwright }}
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Install Chromium
        if: ${{ matrix.playwright }}
        run: npx playwright install --with-deps chromium
      - name: Verify generated app in a local browser
        if: ${{ matrix.playwright }}
        env:
          FACTORY_APP_DIR: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: npm run test:acceptance
