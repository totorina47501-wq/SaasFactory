name: SaaS Factory exploitation report
on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: saas-factory-agent-report
  cancel-in-progress: false
jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          EXPECTED_REPO: totorina47501-wq/SaasFactory
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const run = require('./.github/scripts/agent-report.cjs');
            await run({github, context, core, fs});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saas-factory-report-${{ github.run_id }}
          path: agent-report.json
          if-no-files-found: warn
          retention-days: 30
