name: SaaS Factory agent dispatch
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['SaaS Factory CI']
    types: [completed]
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
concurrency:
  group: saas-factory-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    # workflow_run can fire for pull requests; only a successful PUSH CI on the trusted main repository may wake this privileged dispatcher.
    if: ${{ github.repository == 'totorina47501-wq/SaasFactory' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.name == 'SaaS Factory CI' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      COPILOT_DISPATCH_TOKEN_CONFIGURED: ${{ secrets.COPILOT_DISPATCH_TOKEN != '' }}
    steps:
      - name: Require Copilot user token
        shell: bash
        run: |
          if ! test "$COPILOT_DISPATCH_TOKEN_CONFIGURED" = 'true'; then
            echo '::error::Missing COPILOT_DISPATCH_TOKEN. Configure a repository-scoped user token; GITHUB_TOKEN cannot assign Copilot. See docs/copilot-dispatch-authorization.md.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        name: Coordinate, review, merge, and dispatch from main
        env:
          EXPECTED_REPO: totorina47501-wq/SaasFactory
        with:
          github-token: ${{ secrets.COPILOT_DISPATCH_TOKEN }}
          script: |
            const fs = require('node:fs');
            const run = require('./.github/scripts/agent-dispatch.cjs');
            await run({github, context, core, fs});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-dispatch-report-${{ github.run_id }}
          path: agent-dispatch-report.json
          if-no-files-found: warn
          retention-days: 30
