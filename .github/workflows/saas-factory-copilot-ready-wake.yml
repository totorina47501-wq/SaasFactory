name: SaaS Factory trusted Copilot PR ready wake
# Event-only signal. Runs default-branch workflow; NEVER checkout or execute PR content.
# PAUSED 2026-11-10 by owner. See docs/AGENT-PAUSE-AND-RESUME.md
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  pull-requests: read
concurrency:
  group: saas-factory-ready-wake
  cancel-in-progress: false
jobs:
  wake:
    if: >-
      false &&
      github.repository == 'totorina47501-wq/SaasFactory' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'copilot/') &&
      (github.event.pull_request.user.login == 'Copilot' ||
       github.event.pull_request.user.login == 'copilot-swe-agent[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify exact trusted PR CI before signaling protected dispatcher
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo} = context.repo;
            const source = context.payload.pull_request;
            const identity = owner + '/' + repo;
            if (context.eventName !== 'pull_request_target' || context.payload.action !== 'ready_for_review' ||
                !Number.isSafeInteger(source?.number) || source.number < 1 ||
                source.base?.ref !== 'main' || source.base?.repo?.full_name !== identity ||
                source.head?.repo?.full_name !== identity || !/^copilot\//.test(source.head?.ref || '') ||
                !['copilot','copilot-swe-agent[bot]'].includes(
                  String(source.user?.login || '').toLowerCase()) ||
                !/^[0-9a-f]{40}$/i.test(source.head?.sha || '')) {
              throw new Error('Untrusted ready-for-review event');
            }
            const [workflow, pr, runs] = await Promise.all([
              github.rest.actions.getWorkflow({owner,repo,workflow_id:'ci.yml'}),
              github.rest.pulls.get({owner,repo,pull_number:source.number}),
              github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,repo,workflow_id:'ci.yml',head_sha:source.head.sha,event:'pull_request',per_page:100
              })
            ]);
            const latest = pr.data;
            if (workflow.data.path !== '.github/workflows/ci.yml' ||
                workflow.data.name !== 'SaaS Factory CI' || workflow.data.state !== 'active' ||
                latest.state !== 'open' || latest.draft !== false || latest.merged === true ||
                latest.head?.sha !== source.head.sha || latest.head?.ref !== source.head.ref ||
                latest.head?.repo?.full_name !== identity || latest.base?.ref !== 'main' ||
                !['copilot','copilot-swe-agent[bot]'].includes(
                  String(latest.user?.login || '').toLowerCase())) {
              core.notice('PR or trusted CI identity changed; no wake');
              return;
            }
            const candidates = runs.filter(run => run.workflow_id === workflow.data.id &&
                run.head_sha === latest.head.sha && run.event === 'pull_request' &&
                run.repository?.full_name === identity &&
                run.head_repository?.full_name === identity &&
                Array.isArray(run.pull_requests) && run.pull_requests.length === 1 &&
                run.pull_requests[0].number === source.number);
            candidates.sort((a,b) => Date.parse(b.created_at)-Date.parse(a.created_at) ||
                b.id-a.id || b.run_attempt-a.run_attempt);
            const run = candidates[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              core.notice('Exact-head PR CI not complete; next green PR CI wake will recheck');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,repo,run_id:run.id,filter:'latest',per_page:100
            });
            if (!jobs.some(job => job.run_id === run.id && job.head_sha === latest.head.sha &&
                job.name === 'Free deterministic PR review' &&
                job.status === 'completed' && job.conclusion === 'success')) {
              core.notice('Free review missing; no wake');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,repo,workflow_id:'saas-factory-agent-dispatch.yml',ref:'main'
            });
            core.info('Trusted ready PR signaled protected main coordinator');
