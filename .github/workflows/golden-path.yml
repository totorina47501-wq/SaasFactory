name: Golden Path Qualification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: golden-path-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run factory tests
        run: npm test
      - name: Execute Golden Path qualification
        env:
          GOLDEN_OUTPUT: ${{ runner.temp }}/golden-path-output
          GOLDEN_REPORT: ${{ runner.temp }}/golden-path-report
        run: |
          set -euo pipefail
          mkdir -p "$GOLDEN_OUTPUT" "$GOLDEN_REPORT"
          node delivery/golden-path.mjs \
            --write \
            --verify \
            --output-root "$GOLDEN_OUTPUT" \
            --report-dir "$GOLDEN_REPORT" > "$GOLDEN_REPORT/cli-output.json"
      - name: Upload Golden Path report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-path-report
          path: |
            ${{ runner.temp }}/golden-path-report/golden-path-report.json
            ${{ runner.temp }}/golden-path-report/golden-path-report.md
            ${{ runner.temp }}/golden-path-report/cli-output.json
          if-no-files-found: error
          retention-days: 7
